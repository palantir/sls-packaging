apply plugin: 'groovy'
apply plugin: 'java-gradle-plugin'
apply plugin: 'com.palantir.revapi'

apply plugin: 'com.palantir.external-publish-jar'
apply plugin: 'com.palantir.gradle-plugin-testing'

dependencies {
    api gradleApi()
    api 'com.google.guava:guava'
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.palantir.sls.versions:sls-versions'
    api 'com.palantir.safe-logging:preconditions'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.fasterxml.jackson.core:jackson-core'
    implementation 'com.palantir.safe-logging:safe-logging'

    testImplementation gradleTestKit()
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'

    gradlePluginForTesting 'com.palantir.gradle.consistentversions:gradle-consistent-versions'

    compileOnly 'com.google.errorprone:error_prone_annotations'
    compileOnly 'org.immutables:value::annotations'
    annotationProcessor 'org.immutables:value'
}

gradleTestUtils {
    configurationCacheEnabled = true
}
